name: Release

# Tag a commit `vX.Y.Z` (or run this by hand) and a GitHub release appears with
# a .deb (Debian, Ubuntu, Mint, Pop!_OS), an .rpm (Fedora, openSUSE, RHEL) and
# an AppImage (anything else), plus the Arch PKGBUILD that wraps the .deb.
# Built on Ubuntu 22.04 so the binaries run on any distribution with glibc 2.35+.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libudev-dev libssl-dev build-essential pkg-config patchelf \
            file wget curl xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Version from the tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # A tag whose version does not match the sources produces a half-release:
      # tauri-action publishes under the version in tauri.conf.json while the
      # other steps use the tag. Stop before anything is uploaded.
      - name: The tag and the sources must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${{ steps.meta.outputs.version }}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag $tag | tauri.conf.json $conf | package.json $pkg | Cargo.toml $crate"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match the version in the sources. Run scripts/bump-version.sh $tag, commit, and re-tag."
            exit 1
          fi

      - name: Arch PKGBUILD for this version
        run: |
          mkdir -p dist
          sed "s/^pkgver=.*/pkgver=${{ steps.meta.outputs.version }}/" packaging/arch/PKGBUILD > dist/PKGBUILD
          cp packaging/arch/openghub-bin.install dist/

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage bundling downloads linuxdeploy; keep the build reproducible.
          NO_STRIP: "false"
        with:
          tagName: v__VERSION__
          releaseName: OpenGHub v__VERSION__
          releaseBody: |
            **Install**
            - Debian / Ubuntu / Mint / Pop!_OS: `sudo apt install ./OpenGHub_*_amd64.deb`
            - Fedora / openSUSE / RHEL: `sudo dnf install ./OpenGHub-*.rpm`
            - Arch / Manjaro / EndeavourOS: `makepkg -si` with the attached PKGBUILD (AUR: `openghub-bin`)
            - Flatpak: `flatpak install --user OpenGHub_*.flatpak` (needs the GNOME 50 runtime from Flathub)
            - Anything else: `chmod +x OpenGHub_*.AppImage && ./OpenGHub_*.AppImage`

            The .deb and .rpm install the udev rule; the AppImage offers to install it on first launch.
          releaseDraft: false
          prerelease: false
          args: --bundles deb,rpm,appimage

      # Tauri's AppImage bundles libwayland-* from the build host; mixed with
      # the user's much newer Mesa that fails EGL display creation and the
      # window stays black (verified on Fedora 44 with WebKitGTK 2.52).
      # Dropping them so the host's are used fixes it.
      - name: Repack the AppImage without the bundled Wayland libraries
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v="${{ steps.meta.outputs.version }}"
          img=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          echo "repacking $img"
          curl -sSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          work=$(mktemp -d)
          cp "$img" "$work/in.AppImage"
          (cd "$work" && ./in.AppImage --appimage-extract > /dev/null)
          rm -f "$work"/squashfs-root/usr/lib/libwayland-*.so.*
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "$work/squashfs-root" "OpenGHub_${v}_amd64.AppImage"
          gh release upload "v$v" "OpenGHub_${v}_amd64.AppImage" --clobber

      - name: Attach the PKGBUILD
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.meta.outputs.version }}" dist/PKGBUILD dist/openghub-bin.install --clobber

  # Built in Flathub's own container: the flatpak-builder from Ubuntu's apt is
  # too old for current runtimes (it still calls appstream-compose, which they
  # no longer ship). The container has no gh, so uploading is its own job.
  flatpak:
    name: Flatpak bundle
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Version from the tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: The release .deb
        run: |
          v="${{ steps.meta.outputs.version }}"
          curl -fsSL -o "packaging/flatpak/OpenGHub_${v}_amd64.deb" \
            "https://github.com/${{ github.repository }}/releases/download/v$v/OpenGHub_${v}_amd64.deb"
          sed -i "s/OpenGHub_0.1.0_amd64.deb/OpenGHub_${v}_amd64.deb/" packaging/flatpak/io.github.slyvan25.OpenGHub.yml
          # Newest release first; a version already listed keeps its entry.
          m=packaging/flatpak/io.github.slyvan25.OpenGHub.metainfo.xml
          grep -q "version=\"${v}\"" "$m" || \
            sed -i "s|<releases>|<releases>\n    <release version=\"${v}\" date=\"$(date +%F)\"/>|" "$m"

      - name: Build and bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.slyvan25.OpenGHub.yml
          bundle: OpenGHub_${{ steps.meta.outputs.version }}.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - name: The manifest to submit to Flathub
        run: |
          v="${{ steps.meta.outputs.version }}"
          mkdir -p flathub
          packaging/flatpak/make-flathub-manifest.sh "$v" "packaging/flatpak/OpenGHub_${v}_amd64.deb" \
            > "flathub/io.github.slyvan25.OpenGHub.yml"
          cp packaging/flatpak/io.github.slyvan25.OpenGHub.metainfo.xml flathub/
          tar -czf "flathub-manifest-${v}.tar.gz" -C flathub .

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-release
          path: |
            OpenGHub_${{ steps.meta.outputs.version }}.flatpak
            flathub-manifest-${{ steps.meta.outputs.version }}.tar.gz

  flatpak-upload:
    name: Attach the bundle and the Flathub manifest
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-release

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF#refs/tags/v}"
          gh release upload "v$v" "OpenGHub_${v}.flatpak" "flathub-manifest-${v}.tar.gz" \
            --repo "${{ github.repository }}" --clobber
