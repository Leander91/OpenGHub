# Flatpak manifest. Built in CI from the release .deb (see release.yml), so the
# binary is identical to the other packages; `flatpak run org.flatpak.Builder --user
# --install --force-clean build-dir packaging/flatpak/io.github.slyvan25.OpenGHub.yml` builds
# it locally once OpenGHub_<version>_amd64.deb sits next to this file and the
# shared-modules submodule is checked out (`git submodule update --init`).
#
# What the sandbox needs and why:
#   --device=all                      /dev/hidraw* (HID++) and /dev/uinput (the FF wheel and
#                                     the virtual keyboard); there is no portal for either
#   --talk-name=org.freedesktop.Flatpak
#                                     flatpak-spawn --host: pkexec for the udev rule,
#                                     gst-launch-1.0 / parec for LIGHTSYNC, steam / lutris /
#                                     xdg-open for the launcher, loginctl for "lock computer"
#   --talk-name=org.kde.StatusNotifierWatcher
#                                     the tray icon
#   read-only views of the Steam and Heroic folders, for the Games tab (Lutris is
#   asked through `lutris --list-games` on the host). "Launch at startup" goes
#   through the Background portal and needs nothing here.
id: io.github.slyvan25.OpenGHub
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: openghub
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --device=all
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --filesystem=~/.steam:ro
  - --filesystem=~/.local/share/Steam:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.local/share/Steam:ro
  - --filesystem=~/snap/steam/common/.local/share/Steam:ro
  - --filesystem=xdg-config/heroic:ro
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl/config/heroic:ro
modules:
  # The tray icon (tauri's tray-icon) dlopens libayatana-appindicator3 and
  # panics at startup without it; the GNOME runtime does not ship it.
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: openghub
    buildsystem: simple
    build-commands:
      - ar -x OpenGHub_*_amd64.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/openghub /app/bin/openghub
      - install -Dm644 usr/share/applications/OpenGHub.desktop /app/share/applications/io.github.slyvan25.OpenGHub.desktop
      - sed -i 's/^Icon=.*/Icon=io.github.slyvan25.OpenGHub/' /app/share/applications/io.github.slyvan25.OpenGHub.desktop
      - for s in 32x32 128x128 256x256@2; do install -Dm644 usr/share/icons/hicolor/$s/apps/openghub.png /app/share/icons/hicolor/$s/apps/io.github.slyvan25.OpenGHub.png; done
      - install -Dm644 io.github.slyvan25.OpenGHub.metainfo.xml /app/share/metainfo/io.github.slyvan25.OpenGHub.metainfo.xml
    sources:
      - type: file
        path: OpenGHub_0.1.0_amd64.deb
      - type: file
        path: io.github.slyvan25.OpenGHub.metainfo.xml
